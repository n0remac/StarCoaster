<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarCoaster</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #171b25; color: #f1f3f8; font: 16px system-ui, sans-serif; }
    #status { position: absolute; z-index: 2; inset: 1rem auto auto 1rem; max-width: 36rem; padding: 1rem; background: #202737; border-radius: .5rem; }
    #status.error { background: #54262b; }
    #import { display: none; margin-top: 1rem; }
    #canvas { display: none; width: 100vw; height: 100vh; }
  </style>
  <script src="jszip.min.js"></script>
  <script defer src="index.js?v=private-assets-1"></script>
</head>
<body>
  <section id="status" role="status" aria-live="polite">
    <div id="message">Loading StarCoaster…</div>
    <div id="import">
      <p>Import your locally licensed RCT2 installation:</p>
      <button id="rct2-folder" type="button">Choose RCT2 folder</button>
      <label>or choose a ZIP containing Data/ch.dat:
        <input id="rct2-file" type="file" accept=".zip,application/zip">
      </label>
    </div>
  </section>
  <canvas id="canvas" tabindex="0"></canvas>
</body>
</html>
